<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LiveCam</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#08090d;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    width:min(420px,92%);
    text-align:center;
}

.logo{
    font-size:32px;
    font-weight:800;
    margin-bottom:35px;
}

.logo span{
    color:#6c63ff;
}

.card{
    background:#111319;
    border:1px solid #292d38;
    border-radius:20px;
    padding:25px;
}

.video{
    width:100%;
    aspect-ratio:16/10;
    background:#050609;
    border-radius:15px;
    overflow:hidden;
    margin-bottom:20px;
}

video{
    width:100%;
    height:100%;
    object-fit:cover;
    transform:scaleX(-1);
}

button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:12px;
    background:#6c63ff;
    color:white;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

.status{
    margin-top:15px;
    color:#858b9b;
    font-size:14px;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">
🔥 Live<span>Cam</span>
</div>

<div class="card">

<div class="video">

<video id="localVideo" autoplay muted playsinline></video>

</div>

<button id="activate">
Activar cámara y micrófono
</button>

<div class="status" id="status">
Esperando permiso del navegador...
</div>

</div>

</div>


<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

const localVideo =
document.getElementById("localVideo");

const activate =
document.getElementById("activate");

const status =
document.getElementById("status");

let localStream = null;
let peer = null;
let otherUser = null;

const params =
new URLSearchParams(location.search);

const roomId =
params.get("room");


if(!roomId){

status.textContent =
"No se especificó una sala.";

activate.disabled = true;

}


activate.onclick = async () => {

try{

localStream =
await navigator.mediaDevices.getUserMedia({
    video:{
        facingMode:"user"
    },
    audio:true
});

localVideo.srcObject =
localStream;

activate.style.display="none";

status.textContent =
"Cámara y micrófono activados.";

socket.emit(
"join-room",
roomId
);

}catch(error){

console.error(error);

status.textContent =
"No se pudo acceder a la cámara o micrófono.";

}

};


socket.on(
"user-joined",
async (data) => {

otherUser =
data.socketId;

if(!localStream) return;

await createOffer();

});


socket.on(
"joined-room",
(data) => {

console.log(
"Entraste a:",
data.roomId
);

});


async function createOffer(){

peer =
createPeer();

const offer =
await peer.createOffer();

await peer.setLocalDescription(
offer
);

socket.emit("offer",{

to:otherUser,

offer:offer

});

}


socket.on(
"offer",
async (data) => {

otherUser =
data.from;

peer =
createPeer();

await peer.setRemoteDescription(
data.offer
);

const answer =
await peer.createAnswer();

await peer.setLocalDescription(
answer
);

socket.emit("answer",{

to:data.from,

answer:answer

});

});


socket.on(
"answer",
async (data) => {

if(!peer) return;

await peer.setRemoteDescription(
data.answer
);

});


socket.on(
"ice-candidate",
async (data) => {

if(!peer) return;

try{

await peer.addIceCandidate(
data.candidate
);

}catch(error){

console.error(error);

}

});


function createPeer(){

const connection =
new RTCPeerConnection({

iceServers:[

{
urls:
"stun:stun.l.google.com:19302"
}

]

});


localStream
.getTracks()
.forEach(track => {

connection.addTrack(
track,
localStream
);

});


connection.onicecandidate =
(event) => {

if(event.candidate){

socket.emit(
"ice-candidate",
{

to:otherUser,

candidate:event.candidate

});

}

};


connection.ontrack =
(event) => {

console.log(
"🎥 Stream remoto recibido"
);

};


connection.onconnectionstatechange =
() => {

console.log(
"WebRTC:",
connection.connectionState
);

};


return connection;

}


socket.on(
"room-full",
() => {

status.textContent =
"Esta llamada ya está llena.";

activate.disabled = true;

});


socket.on(
"user-left",
() => {

status.textContent =
"El otro usuario salió de la llamada.";

});

</script>

</body>
</html>
